"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](red)\
$os\
$username\
$hostname\
[](fg:red bg:peach)\
$directory\
[](fg:peach bg:yellow)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$c\
$rust\
$golang\
$nodejs\
$php\
${custom.laravel}\
$java\
$kotlin\
$haskell\
$python\
[](fg:green bg:sapphire)\
$docker_context\
$gcloud\
$conda\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
$cmd_duration\
$git_metrics\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

[hostname]
ssh_symbol = "󰴜"
ssh_only = false
style = "bg:red fg:crust"
format = '[ $ssh_symbol](bg:red)[ $hostname](bg:red)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
read_only = ""
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Videos" = ""
"myCode" = " "

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[git_metrics]
disabled = false
only_nonzero_diffs = true
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
not_capable_style = "bg:green fg:red"

[c]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[php]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[java]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[kotlin]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[haskell]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[gcloud]
symbol = "🅶"
style = "bg:sapphire"
format = '[[ $symbol( $project) ](fg:crust bg:sapphire)]($style)'
detect_env_vars = ["CLOUDSDK_CORE_PROJECT", "STARSHIP_GCLOUD_ACTIVE"]

[conda]
symbol = ""
style = "fg:crust bg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = false
format = " in $duration "
style = "bg:lavender"
disabled = false
show_notifications = false
min_time_to_notify = 45000

[custom.laravel]
command = '''
dir=`pwd`;
while [ "$dir" != "/" ] ; do
    if  [[ -f "$dir/artisan" && -f "$dir/composer.lock" ]]; then
        grep '\"name\": \"laravel/framework\"' -A1 "$dir/composer.lock" | tail -n 1 | awk -F '\"' '{print $4}'
        exit 0
    fi
    dir=`dirname "$dir"`;
done
exit 1'''
when = '''
dir=`pwd`;
while [ "$dir" != "/" ] ; do
    if  [[ -f "$dir/artisan" && -f "$dir/composer.lock" ]]; then
        exit 0
    fi
    dir=`dirname "$dir"`;
done
exit 1'''
description = "The version of Laravel used by the current project"
symbol = ""
style = "bg:green"
format = '[[ $symbol( $output) ](fg:crust bg:green)]($style)'

